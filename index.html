<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walletiz — Avis & Prospection</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --ok: #22c55e;
        --called: #7f1d1d;
        --called-border: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 20px 14px 60px;
      }
      .wrap { width: 100%; max-width: 560px; }
      h1 { font-size: 1.4rem; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 18px; font-size: 0.9rem; }

      /* Onglets */
      .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
      .tab {
        flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
        background: var(--card); color: var(--muted); font-weight: 600; font-size: 0.95rem;
        cursor: pointer; text-align: center;
      }
      .tab.active { background: var(--accent); color: white; border-color: var(--accent); }

      .card {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 16px; padding: 18px;
      }
      label { display: block; font-size: 0.82rem; color: var(--muted); margin: 12px 0 6px; }
      input {
        width: 100%; padding: 13px; font-size: 1rem; border-radius: 10px;
        border: 1px solid var(--border); background: #0b1220; color: var(--text);
      }
      input:focus { outline: 2px solid var(--accent); border-color: transparent; }
      button.primary {
        width: 100%; margin-top: 16px; padding: 14px; font-size: 1rem; font-weight: 600;
        border: 0; border-radius: 10px; background: var(--accent); color: white; cursor: pointer;
      }
      button.primary:hover { background: var(--accent-hover); }
      button.primary:disabled { opacity: 0.6; cursor: default; }
      .msg { margin-top: 14px; font-size: 0.9rem; }
      .msg.error { color: #f87171; }

      .hidden { display: none; }

      /* Mode avis */
      .result {
        margin-top: 16px; padding: 15px; border: 1px solid var(--border);
        border-radius: 12px; background: #0b1220;
      }
      .result h3 { margin: 0 0 4px; font-size: 1.05rem; }
      .result .addr { color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
      .actions { display: flex; flex-direction: column; gap: 10px; }
      .btn-link {
        display: block; text-align: center; text-decoration: none; padding: 12px;
        border-radius: 10px; font-weight: 600;
      }
      .btn-open { background: var(--ok); color: #052e16; }
      .btn-copy { background: transparent; color: var(--text); border: 1px solid var(--border); cursor: pointer; }

      /* Mode prospection */
      .counter { margin: 14px 0 8px; font-size: 0.9rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
      .toolbar { display: flex; gap: 8px; align-items: center; }
      .chip {
        font-size: 0.78rem; padding: 6px 10px; border-radius: 999px;
        border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer;
      }
      .chip.on { background: var(--accent); color: white; border-color: var(--accent); }
      .biz {
        margin-top: 10px; padding: 14px; border: 1px solid var(--border);
        border-left: 4px solid var(--border); border-radius: 12px; background: #0b1220;
      }
      .biz.called { background: #1a0f14; border-left-color: var(--called-border); }
      .biz-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
      .biz h4 { margin: 0 0 3px; font-size: 1rem; }
      .biz .addr { color: var(--muted); font-size: 0.8rem; margin: 0 0 10px; }
      .biz-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .biz a.call {
        text-decoration: none; background: var(--ok); color: #052e16; font-weight: 700;
        padding: 10px 14px; border-radius: 10px; font-size: 0.9rem;
      }
      .biz a.site {
        text-decoration: none; color: #818cf8; border: 1px solid var(--border);
        padding: 10px 12px; border-radius: 10px; font-size: 0.85rem;
      }
      .biz a.avis {
        text-decoration: none; color: var(--text); border: 1px solid var(--border);
        padding: 10px 12px; border-radius: 10px; font-size: 0.85rem;
      }
      .no-site { color: var(--muted); font-size: 0.8rem; border: 1px dashed var(--border); padding: 9px 12px; border-radius: 10px; }
      .no-tel { color: #f87171; font-size: 0.82rem; }
      .call-toggle {
        border: 1px solid var(--border); background: transparent; color: var(--muted);
        border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
      }
      .biz.called .call-toggle { background: var(--called-border); color: white; border-color: var(--called-border); }

      .toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: var(--ok); color: #052e16; padding: 10px 18px; border-radius: 999px;
        font-weight: 600; font-size: 0.9rem; opacity: 0; transition: opacity 0.2s; pointer-events: none;
      }
      .toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Walletiz</h1>
      <p class="sub">Outil interne — avis Google & prospection.</p>

      <div class="tabs">
        <div class="tab active" id="tab-avis" onclick="switchMode('avis')">⭐ Lien d'avis</div>
        <div class="tab" id="tab-pros" onclick="switchMode('pros')">📞 Prospection</div>
      </div>

      <!-- ============ MODE AVIS ============ -->
      <div id="mode-avis" class="card">
        <form id="form-avis">
          <label for="nom">Nom du commerce</label>
          <input id="nom" placeholder="Ex : Boulangerie Dupont" autocomplete="off" required />
          <label for="ville">Ville</label>
          <input id="ville" placeholder="Ex : Pointe-à-Pitre" autocomplete="off" required />
          <button class="primary" type="submit" id="btn-avis">Générer le lien d'avis</button>
        </form>
        <div id="msg-avis" class="msg"></div>
        <div id="out-avis"></div>
      </div>

      <!-- ============ MODE PROSPECTION ============ -->
      <div id="mode-pros" class="card hidden">
        <form id="form-pros">
          <label for="metier">Métier / type de commerce</label>
          <input id="metier" placeholder="Ex : coiffeur, institut de beauté" autocomplete="off" required />
          <label for="zone">Zone</label>
          <input id="zone" value="Guadeloupe" autocomplete="off" />
          <button class="primary" type="submit" id="btn-pros">Rechercher</button>
        </form>
        <div id="msg-pros" class="msg"></div>

        <div id="counter" class="counter hidden">
          <span id="counter-text"></span>
          <span class="toolbar">
            <button type="button" class="chip" id="chip-hide" onclick="toggleHideCalled()">Masquer appelés</button>
          </span>
        </div>
        <div id="out-pros"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
      /* ---------- Utilitaires ---------- */
      const toast = document.getElementById("toast");
      function showToast(t) {
        toast.textContent = t; toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1500);
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }
      async function copy(text) {
        try { await navigator.clipboard.writeText(text); showToast("Lien copié ✓"); }
        catch { showToast("Copie impossible"); }
      }
      window.__copy = copy;

      /* ---------- Onglets ---------- */
      function switchMode(mode) {
        const avis = mode === "avis";
        document.getElementById("mode-avis").classList.toggle("hidden", !avis);
        document.getElementById("mode-pros").classList.toggle("hidden", avis);
        document.getElementById("tab-avis").classList.toggle("active", avis);
        document.getElementById("tab-pros").classList.toggle("active", !avis);
      }

      /* ================= MODE AVIS ================= */
      const formAvis = document.getElementById("form-avis");
      const btnAvis = document.getElementById("btn-avis");
      const msgAvis = document.getElementById("msg-avis");
      const outAvis = document.getElementById("out-avis");

      formAvis.addEventListener("submit", async (e) => {
        e.preventDefault();
        msgAvis.textContent = ""; msgAvis.className = "msg"; outAvis.innerHTML = "";
        btnAvis.disabled = true; btnAvis.textContent = "Recherche…";
        try {
          const res = await fetch("/api/place", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nom: document.getElementById("nom").value.trim(),
              ville: document.getElementById("ville").value.trim(),
            }),
          });
          const data = await res.json();
          if (!res.ok) { msgAvis.textContent = data.error || "Erreur."; msgAvis.className = "msg error"; }
          else renderAvis(data);
        } catch (err) {
          msgAvis.textContent = "Problème de connexion : " + err.message; msgAvis.className = "msg error";
        } finally { btnAvis.disabled = false; btnAvis.textContent = "Générer le lien d'avis"; }
      });

      function renderAvis(data) {
        const b = data.best;
        const others = data.results.slice(1);
        let html = `
          <div class="result">
            <h3>${esc(b.nom)}</h3>
            <p class="addr">${esc(b.adresse)}</p>
            <div class="actions">
              <a class="btn-link btn-open" href="${b.reviewLink}" target="_blank" rel="noopener">Ouvrir la fenêtre d'avis</a>
              <button class="btn-link btn-copy" type="button" onclick="window.__copy('${b.reviewLink}')">Copier le lien</button>
            </div>
          </div>`;
        if (others.length) {
          html += `<details style="margin-top:14px"><summary style="color:var(--muted);cursor:pointer;font-size:0.85rem">Pas le bon ? Voir ${others.length} autre(s)</summary>`;
          for (const o of others) {
            html += `<div class="result"><h3>${esc(o.nom)}</h3><p class="addr">${esc(o.adresse)}</p>
              <div class="actions">
                <a class="btn-link btn-open" href="${o.reviewLink}" target="_blank" rel="noopener">Ouvrir l'avis</a>
                <button class="btn-link btn-copy" type="button" onclick="window.__copy('${o.reviewLink}')">Copier</button>
              </div></div>`;
          }
          html += `</details>`;
        }
        outAvis.innerHTML = html;
      }

      /* ================= MODE PROSPECTION ================= */
      const formPros = document.getElementById("form-pros");
      const btnPros = document.getElementById("btn-pros");
      const msgPros = document.getElementById("msg-pros");
      const outPros = document.getElementById("out-pros");
      const counter = document.getElementById("counter");
      const counterText = document.getElementById("counter-text");
      const chipHide = document.getElementById("chip-hide");

      let currentResults = [];
      let hideCalled = false;

      // Suivi des « déjà appelés » — mémorisé dans le navigateur.
      const STORE_KEY = "pixcard_called";
      function loadCalled() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { return {}; }
      }
      function saveCalled(obj) {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch {}
      }
      let called = loadCalled();

      function isCalled(id) { return !!called[id]; }
      function toggleCalled(id) {
        if (called[id]) delete called[id]; else called[id] = true;
        saveCalled(called);
        renderPros();
      }
      window.__toggleCalled = toggleCalled;

      function toggleHideCalled() {
        hideCalled = !hideCalled;
        chipHide.classList.toggle("on", hideCalled);
        renderPros();
      }

      formPros.addEventListener("submit", async (e) => {
        e.preventDefault();
        msgPros.textContent = ""; msgPros.className = "msg"; outPros.innerHTML = "";
        counter.classList.add("hidden");
        btnPros.disabled = true; btnPros.textContent = "Recherche…";
        try {
          const res = await fetch("/api/search", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              metier: document.getElementById("metier").value.trim(),
              zone: document.getElementById("zone").value.trim() || "Guadeloupe",
            }),
          });
          const data = await res.json();
          if (!res.ok) { msgPros.textContent = data.error || "Erreur."; msgPros.className = "msg error"; }
          else {
            currentResults = data.results || [];
            if (currentResults.length === 0) { msgPros.textContent = "Aucun résultat."; msgPros.className = "msg error"; }
            renderPros();
          }
        } catch (err) {
          msgPros.textContent = "Problème de connexion : " + err.message; msgPros.className = "msg error";
        } finally { btnPros.disabled = false; btnPros.textContent = "Rechercher"; }
      });

      function renderPros() {
        if (currentResults.length === 0) { counter.classList.add("hidden"); outPros.innerHTML = ""; return; }
        const nbCalled = currentResults.filter((b) => isCalled(b.placeId)).length;
        counter.classList.remove("hidden");
        counterText.textContent = `${currentResults.length} résultats · ${nbCalled} appelé(s)`;

        let html = "";
        for (const b of currentResults) {
          const done = isCalled(b.placeId);
          if (hideCalled && done) continue;
          const tel = b.telephone
            ? `<a class="call" href="${esc(b.telLink)}">📞 ${esc(b.telephone)}</a>`
            : `<span class="no-tel">Pas de numéro</span>`;
          const site = b.website
            ? `<a class="site" href="${esc(b.website)}" target="_blank" rel="noopener">🌐 Site</a>`
            : `<span class="no-site">Pas de site</span>`;
          html += `
            <div class="biz ${done ? "called" : ""}">
              <div class="biz-head">
                <div>
                  <h4>${esc(b.nom)}</h4>
                  <p class="addr">${esc(b.adresse)}</p>
                </div>
                <button class="call-toggle" type="button" onclick="window.__toggleCalled('${esc(b.placeId)}')">
                  ${done ? "✓ Appelé" : "Appelé ?"}
                </button>
              </div>
              <div class="biz-row">
                ${tel}
                ${site}
                <a class="avis" href="${b.reviewLink}" target="_blank" rel="noopener">⭐ Avis</a>
              </div>
            </div>`;
        }
        outPros.innerHTML = html || `<p class="sub">Tous les résultats sont masqués (déjà appelés).</p>`;
      }
    </script>
  </body>
</html>
